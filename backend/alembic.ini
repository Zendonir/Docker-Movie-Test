# Nur für Entwickler (neue Migrationen erzeugen):
#   cd backend && alembic revision --autogenerate -m "beschreibung"
# Im Betrieb werden Migrationen automatisch beim Start ausgeführt.
[alembic]
prepend_sys_path = .
script_location = app/database/migrations
sqlalchemy.url = sqlite:///./dev.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
